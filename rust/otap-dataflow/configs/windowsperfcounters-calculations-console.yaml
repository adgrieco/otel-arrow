# platform: windows-only
# Calculation example using built-in Windows performance objects.
# Requires the Memory, Processor, Cache, and PhysicalDisk performance objects,
# including the PhysicalDisk _Total instance and provider-defined base counters.
# From rust\otap-dataflow:
# cargo run --features windowsperfcounters-receiver --bin df_engine -- -c configs\windowsperfcounters-calculations-console.yaml

version: otel_dataflow/v1
engine: {}
policies:
  resources:
    core_allocation:
      type: core_count
      count: 1
groups:
  default:
    pipelines:
      main:
        nodes:
          calculations:
            type: receiver:windowsperfcounters
            config:
              metrics:
                windows.memory.available:
                  unit: By
                  description: Physical memory immediately available for allocation.
                  gauge: {}
                windows.processor.time:
                  unit: "%"
                  description: Average processor utilization across all logical processors.
                  gauge: {}
                windows.memory.committed:
                  unit: "%"
                  description: Percentage of the memory commit limit currently in use.
                  gauge: {}
                windows.cache.data_map_hits:
                  unit: "%"
                  description: Percentage of data-map requests served from the system cache.
                  gauge: {}
                windows.disk.read.time:
                  unit: s
                  description: Average time to complete a physical-disk read.
                  gauge: {}
                windows.disk.read.size:
                  unit: By
                  description: Average bytes transferred by a physical-disk read.
                  gauge: {}
              perfcounters:
                - object: Memory
                  counters:
                    - name: Available Bytes
                      metric: windows.memory.available
                    - name: "% Committed Bytes In Use"
                      metric: windows.memory.committed
                - object: Processor
                  instances: ["_Total"]
                  counters:
                    - name: "% Processor Time"
                      metric: windows.processor.time
                - object: Cache
                  counters:
                    - name: Data Map Hits %
                      metric: windows.cache.data_map_hits
                - object: PhysicalDisk
                  instances: ["_Total"]
                  counters:
                    - name: Avg. Disk sec/Read
                      metric: windows.disk.read.time
                    - name: Avg. Disk Bytes/Read
                      metric: windows.disk.read.size
              collection_interval: 30s
          console:
            type: exporter:console
            config:
              format: pretty
              unicode: false
              color: false
        connections:
          - from: calculations
            to: console
