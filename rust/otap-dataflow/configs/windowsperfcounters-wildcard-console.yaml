# platform: windows-only
# Wildcard discovery example using the built-in Process performance object.
# The exact Memory counter continues emitting when individual process counters
# appear, disappear, or temporarily fail.
# From rust\otap-dataflow:
# cargo run --features windowsperfcounters --bin df_engine -- -c configs\windowsperfcounters-wildcard-console.yaml

version: otel_dataflow/v1
engine: {}
policies:
  resources:
    core_allocation:
      type: core_count
      count: 1
groups:
  default:
    pipelines:
      main:
        nodes:
          wildcard:
            type: receiver:windowsperfcounters
            config:
              metrics:
                windows.memory.available:
                  unit: By
                  description: Physical memory immediately available for allocation.
                  gauge: {}
                windows.process.private:
                  unit: By
                  description: Committed private memory for each process instance.
                  up_down_counter: {}
              perfcounters:
                - object: Memory
                  counters:
                    - name: Available Bytes
                      metric: windows.memory.available
                - object: Process
                  instances: ["*"]
                  counters:
                    - name: Private Bytes
                      metric: windows.process.private
              collection_interval: 5s
              wildcard_refresh_interval: 5s
              max_instances_per_wildcard: 256
              max_expanded_counters: 512
          console:
            type: exporter:console
            config:
              format: pretty
              unicode: false
              color: false
        connections:
          - from: wildcard
            to: console
